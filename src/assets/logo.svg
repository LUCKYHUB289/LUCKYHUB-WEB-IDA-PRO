<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="lh-bg-a" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#191033"/>
      <stop offset="0.55" stop-color="#0c0a1d"/>
      <stop offset="1" stop-color="#05040c"/>
    </radialGradient>
    <linearGradient id="lh-ring-a" x1="0" y1="0" x2="1" y2="1">
